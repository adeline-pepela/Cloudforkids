{% if user.is_authenticated and user.email and not user.email_verified %}
<div class="alert alert-info rounded-4 d-flex flex-wrap align-items-center gap-2 mb-2" role="status">
  <i class="bi bi-envelope-check-fill" aria-hidden="true"></i>
  <span class="me-auto"><span>Please confirm your email address:</span> <strong>{{ user.email }}</strong>. <span>Open the link we emailed you.</span></span>
  <form method="post" action="{% url 'accounts:resend_confirmation' %}" class="m-0">
    {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" class="btn btn-sm btn-outline-cloud">Send the link again</button>
  </form>
</div>
{% endif %}
