# Deploys the website on Render after every push to Pre-production (the branch the Render service runs).
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   RENDER_API_KEY     a Render API key (Render > Account Settings > API Keys)
#   RENDER_SERVICE_ID  the web service id, e.g. srv-db13adegekts73c09g70
# Until both exist the job is skipped, so pushes never fail because of it.
name: Deploy to Render

on:
  push:
    branches: [Pre-production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Start a Render deploy of this commit
        if: env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != ''
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            -d "{\"commitId\": \"$GITHUB_SHA\"}" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
      - name: Secrets missing
        if: env.RENDER_API_KEY == '' || env.RENDER_SERVICE_ID == ''
        run: echo "Add the RENDER_API_KEY and RENDER_SERVICE_ID repository secrets to deploy automatically."
