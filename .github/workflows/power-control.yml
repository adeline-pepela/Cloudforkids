# One-click manual Power Control for Cloud for Kids on AWS (RDS + ECS Express + ALB offline banner + EventBridge schedule).
# Go to GitHub -> Actions -> "Power Control (AWS)" -> "Run workflow" from desktop or phone.
name: Power Control (AWS)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose power action"
        required: true
        default: "status"
        type: choice
        options:
          - status
          - on
          - off
          - enable_schedule
          - enable_24_7

permissions:
  id-token: write
  contents: read

jobs:
  power:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::056187302207:role/github-actions-cloudforkids-deploy
          aws-region: eu-west-1

      - name: Run Cloud for Kids power action (${{ inputs.action }})
        run: |
          echo "Invoking cloudforkids-power-controller with action=${{ inputs.action }}..."
          aws lambda invoke \
            --region eu-west-1 \
            --function-name cloudforkids-power-controller \
            --cli-read-timeout 660 \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"${{ inputs.action }}"}' \
            /tmp/power-response.json
          echo "=== RESULT ==="
          python3 -m json.tool /tmp/power-response.json
          if grep -q '"errorMessage"' /tmp/power-response.json; then
            echo "Lambda returned an error!"
            exit 1
          fi
